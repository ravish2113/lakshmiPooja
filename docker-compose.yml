services:
  postgres:
    image: postgres:16-alpine
    container_name: pooja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pooja_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-pooja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pooja_password}
    ports:
      - "5432:5432"
    volumes:
      - pooja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pooja} -d ${POSTGRES_DB:-pooja_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: pooja-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pooja_ledger}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pooja}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pooja_password}
      JWT_SECRET: ${JWT_SECRET:-local-test-only-change-this-to-a-random-secret-at-least-32-chars}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-LocalTestOnly123!}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pooja-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pooja_pgdata:
